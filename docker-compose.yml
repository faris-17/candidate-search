services:
  postgres:
    image: postgres:16-alpine
    container_name: candidate-search-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password@123
      POSTGRES_DB: candidate_search
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d candidate_search"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
